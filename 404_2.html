
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oje! 404 - Seite nicht gefunden</title>
    <style>
        /* Basic Styling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f9ff; /* Soft Baby Blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Rounded Font */
            color: #334155;
            overflow: hidden;
        }

        /* Main Container */
        .error-container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* The Fluffy Monster */
        .monster {
            width: 200px;
            height: 200px;
            background-color: #ff99cc; /* Soft Pink */
            border-radius: 70% 30% 70% 30% / 30% 70% 30% 70%; /* Irregular, soft shape */
            margin: 0 auto 30px auto;
            position: relative;
            box-shadow: 0 10px 20px rgba(255, 153, 204, 0.4);
            animation: monster-bob 4s ease-in-out infinite; /* Gentle bobbing */
        }

        /* The Eye Area */
        .eyes {
            position: absolute;
            top: 60px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* A Single Eye */
        .eye {
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
        }

        /* The Pupil */
        .pupil {
            width: 20px;
            height: 20px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Starting position in the center */
            transition: transform 0.1s ease-out; /* Smooth movement */
        }

        /* The Mouth (Sad) */
        .mouth {
            width: 40px;
            height: 20px;
            border: 4px solid #333;
            border-bottom: 0;
            border-radius: 50px 50px 0 0; /* Upside-down smile */
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* The Monster Shadow */
        .shadow {
            width: 150px;
            height: 20px;
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            margin: -15px auto 30px auto;
            animation: shadow-pulse 4s ease-in-out infinite;
        }

        /* Text Styling */
        h1 {
            font-size: 6rem;
            margin: 0;
            color: #ff99cc;
            text-shadow: 2px 2px 0px white;
        }

        h2 {
            font-size: 2rem;
            margin: -10px 0 15px 0;
        }

        p {
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto 30px auto;
            line-height: 1.5;
            color: #64748b;
        }

        /* The Back Button */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1.1rem;
            color: white;
            background-color: #ff99cc;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 10px rgba(255, 153, 204, 0.3);
        }

        .btn:hover {
            background-color: #ff80bf;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(255, 153, 204, 0.4);
        }

        /* Animated Background Clouds */
        .cloud {
            position: absolute;
            background-color: white;
            border-radius: 50px;
            z-index: 1;
            opacity: 0.7;
        }

        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background-color: white;
            border-radius: 50px;
        }

        .cloud-1 {
            width: 100px; height: 40px; top: 20%; left: 10%;
            animation: cloud-drift 20s linear infinite;
        }
        .cloud-1::after { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud-1::before { width: 40px; height: 40px; top: -15px; left: 50px; }

        .cloud-2 {
            width: 150px; height: 60px; top: 60%; right: 10%;
            animation: cloud-drift 25s linear infinite reverse;
            opacity: 0.5;
        }
        .cloud-2::after { width: 80px; height: 80px; top: -40px; left: 25px; }
        .cloud-2::before { width: 60px; height: 60px; top: -20px; left: 70px; }

        /* KEYFRAMES ANIMATIONS */
        @keyframes monster-bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes shadow-pulse {
            0%, 100% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(0.8); opacity: 0.05; }
        }

        @keyframes cloud-drift {
            0% { transform: translateX(-10vw); }
            100% { transform: translateX(110vw); }
        }

    </style>
</head>
<body>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>

    <div class="error-container">
        <h1>404</h1>
        
        <div class="monster">
            <div class="eyes">
                <div class="eye"><div class="pupil" id="pupil-left"></div></div>
                <div class="eye"><div class="pupil" id="pupil-right"></div></div>
            </div>
            <div class="mouth"></div>
        </div>
        <div class="shadow"></div>

        <h2>Oje! Verirrt?</h2>
        <p>Unser kleines Such-Monster hat überall gesucht, aber diese Seite scheint einfach unauffindbar zu sein. Vielleicht hat sie sich versteckt?</p>
        
        <a href="/" class="btn">Bring mich nach Hause</a>
    </div>

    <script>
        // Select the pupils
        const pupilLeft = document.getElementById('pupil-left');
        const pupilRight = document.getElementById('pupil-right');

        // Function to move the pupils
        document.addEventListener('mousemove', (e) => {
            // Get mouse position
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            // Get window size
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            // Calculate the offset from the center (normalized between -1 and 1)
            const offsetX = (mouseX / windowWidth) * 2 - 1;
            const offsetY = (mouseY / windowHeight) * 2 - 1;

            // Define maximum movement distance for pupils within the eye (in pixels)
            const maxMove = 10; 

            // Calculate the new pupil position (offset starting from the center translate(-50%, -50%))
            const moveX = offsetX * maxMove;
            const moveY = offsetY * maxMove;

            // Apply the new transformation
            // We need to keep the initial -50% translation for centering
            const transformString = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
            
            pupilLeft.style.transform = transformString;
            pupilRight.style.transform = transformString;
        });
    </script>
</body>
</html>
